[project]
name = "dbt-dqm"
version = "0.2.0a6"
description = "Persistent dbt test issue tracking and a local review application"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "Aliaksei Adamovich" }]
keywords = ["dbt", "data-quality", "data-testing", "data-observability", "bigquery", "postgres"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "dbt-core==1.12.5",
  # Security floors for transitive dependencies (#24): wheels don't carry uv.lock, so these keep
  # installs from retaining versions with known advisories.
  # dbt's older serializer cannot initialize on Python 3.14.
  "mashumaro>=3.17,<3.18",
  "pandas>=2.2,<4",
  "platformdirs>=4,<5",
  "pyarrow>=25.0.1,<26",
  "pyyaml>=6,<7",
  "sqlparse>=0.6.0,<0.7",  # five advisories fixed in 0.6.0; dbt-core 1.12.5 allows <0.7
  "streamlit>=1.52,<2",
  "XlsxWriter>=3.2,<4",
  "urllib3>=2.8.0,<3",  # three advisories fixed in 2.8.0
]

[project.optional-dependencies]
bigquery = [
  "dbt-bigquery==1.12.1",
  "google-cloud-bigquery>=3.25,<4",
  "oauthlib>=4.0.0,<5",  # Security floor for pandas-gbq authentication
]
postgres = ["dbt-postgres>=1.11,<1.12"]

[project.urls]
Homepage = "https://github.com/a-adamovich/dbt-dqm"
Repository = "https://github.com/a-adamovich/dbt-dqm"
Issues = "https://github.com/a-adamovich/dbt-dqm/issues"
Changelog = "https://github.com/a-adamovich/dbt-dqm/blob/main/CHANGELOG.md"

[project.scripts]
dbt-dqm = "dbt_dqm_app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_dqm_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
