[project]
name = "dbt-dqm"
version = "0.2.0"
description = "Persistent dbt test issue tracking and a local review application"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [{ name = "Aliaksei Adamovich" }]
keywords = ["dbt", "data-quality", "data-testing", "data-observability", "bigquery", "postgres"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "dbt-core==1.11.15",
  "dbt-bigquery==1.11.3",
  "dbt-postgres>=1.11,<1.12",
  "google-cloud-bigquery>=3.25,<4",
  "pandas>=2.2,<3",
  "platformdirs>=4,<5",
  "pyarrow>=17,<20",
  "pyyaml>=6,<7",
  "streamlit>=1.41,<2",
]

[project.urls]
Homepage = "https://github.com/a-adamovich/dbt-dqm"
Repository = "https://github.com/a-adamovich/dbt-dqm"
Issues = "https://github.com/a-adamovich/dbt-dqm/issues"
Changelog = "https://github.com/a-adamovich/dbt-dqm/blob/main/CHANGELOG.md"

[project.scripts]
dbt-dqm = "dbt_dqm_app.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_dqm_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
