[project]
name = "dbt-dqm"
version = "0.1.0"
description = "Persistent dbt test issue tracking and a local review application"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [{ name = "Aliaksei Adamovich" }]
dependencies = [
  "dbt-core==1.11.11",
  "dbt-bigquery==1.11.3",
  "google-cloud-bigquery>=3.25,<4",
  "pandas>=2.2,<3",
  "platformdirs>=4,<5",
  "pyarrow>=17,<20",
  "pyyaml>=6,<7",
  "streamlit>=1.41,<2",
]

[project.scripts]
dbt-dqm = "dbt_dqm_app.cli:main"

[dependency-groups]
# dbt-postgres is a dev-only dependency for validating the dbt package (models/, macros/) against
# a second adapter in integration_tests/demo_postgres. The dbt_dqm_app review app itself remains
# BigQuery-only (see src/dbt_dqm_app/warehouse.py) and does not depend on it.
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "dbt-postgres>=1.11,<1.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_dqm_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
