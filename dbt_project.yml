name: dbt_dqm
version: 0.2.2
config-version: 2
require-dbt-version: [">=1.11.0", "<3.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages", "logs"]

models:
  dbt_dqm:
    +pre-hook: "{{ dbt_dqm.empty_preflight() }}"
    +post-hook: "{{ dbt_dqm.public_view_grants() }}"
    dqm_reconcile:
      +pre-hook:
        - "{{ dbt_dqm.reconcile_lock() }}"
        - "{{ dbt_dqm.reconcile_pre() }}"
      +post-hook:
        - "{{ dbt_dqm.apply_reconciliation() }}"
    dqm_annotation_changes:
      +post-hook: "{{ dbt_dqm.app_table_finish('dqm_annotation_changes') }}"
      +pre-hook:
        - "{{ dbt_dqm.reconcile_lock() }}"
        - "{{ dbt_dqm.app_table_setup() }}"
    dqm_missed_issues:
      +post-hook: "{{ dbt_dqm.app_table_finish('dqm_missed_issues') }}"
      +pre-hook:
        - "{{ dbt_dqm.reconcile_lock() }}"
        - "{{ dbt_dqm.app_table_setup() }}"
