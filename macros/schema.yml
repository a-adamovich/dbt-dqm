version: 2

macros:
  - name: sql_string
    description: >
      Converts a Jinja value into a safe SQL string expression, dispatched per adapter since
      string-literal escaping rules genuinely differ across warehouses. Nulls remain typed nulls.
    arguments:
      - name: value
        type: any
        description: Value to render as a SQL string expression.

  - name: tracked_test
    description: >
      Returns whether a manifest node is a data test selected for dbt-dqm collection. A tracked test
      must have the configured tag and store_failures enabled.
    arguments:
      - name: node
        type: ParsedNode
        description: dbt result or manifest node to inspect.

  - name: relation_name
    description: >
      Produces a fully qualified, adapter-correctly-quoted relation name in the target schema or the
      schema selected by dbt_dqm_schema. Centralizing this rule keeps hook tables and package models
      aligned across every supported adapter.
    arguments:
      - name: name
        type: string
        description: Unqualified dbt-dqm table or view identifier.

  - name: compact_json
    description: >
      Serializes manifest metadata such as tags and test meta into compact JSON while preserving
      list order and string case.
    arguments:
      - name: value
        type: any
        description: Jinja value to serialize.

  - name: capture_tables_ddl
    description: >
      Returns DDL for hook-owned tracking tables, with BigQuery partitions and Postgres indexes.
      App-written audit and missed-issue models own their tables separately.

  - name: ensure_column
    description: >
      Adds a column to a relation if it is not already present. Generic replacement for one-off
      hardcoded migration branches — reuse this for every future additive schema change.
    arguments:
      - name: relation
        type: Relation
        description: Relation to alter.
      - name: column_name
        type: string
        description: Column to add if missing.
      - name: column_type
        type: string
        description: Portable column type, e.g. the result of dbt.type_string().

  - name: ensure_capture_tables
    description: >
      Executes guarded installation and ordered, verified additive migrations under the
      schema coordination protocol. Existing history and annotations are preserved.

  - name: positive_integer_var
    description: Validates an optional dbt variable as a strictly positive YAML integer.

  - name: cleanup_dqm_logs
    description: Deletes execution and observation log rows older than a positive retention window.

  - name: capture_test_results
    description: >
      on-run-end collector that persists tracked test executions and each failing test's
      deduplicated observations, committed per test as it's processed. It validates mandatory
      meta.dbt_dqm.granularity, records collection errors, and never treats inconclusive results as
      evidence that an issue passed.
    arguments:
      - name: results
        type: list[RunResult]
        description: dbt invocation results supplied to the on-run-end hook.

  - name: dual
    description: >
      A single-row FROM source for selecting typed literals from, e.g. an empty typed CTE via
      dbt_dqm.dual() in the FROM clause paired with a false WHERE. Dispatched per adapter since
      BigQuery has no bare dummy-row source usable with WHERE.

  - name: sha256_hex
    description: >
      Lowercase hex-encoded SHA-256 of a SQL string expression, dispatched per adapter. A functional
      requirement, not a style choice — unique_id/occurrence_id depend on every supported adapter
      implementing this exact shape. Postgres requires the pgcrypto extension.
    arguments:
      - name: expression
        type: string
        description: SQL expression to hash.

  - name: json_object_string
    description: >
      A JSON object serialized to a string, built from an ordered list of (key, value_sql) pairs,
      dispatched per adapter since JSON-object construction syntax differs across warehouses.
    arguments:
      - name: pairs
        type: list[tuple[string, string]]
        description: Ordered (key, value_sql) pairs; value_sql is a SQL expression, already quoted/cast.

  - name: canonical_identity_string
    description: >
      Produces the byte-stable, length-prefixed dqm-id-v1 identity preimage from ordered normalized
      key/value expressions. Unlike display JSON, its output is required to be identical on every
      supported adapter and is protected by golden hash vectors.
    arguments:
      - name: pairs
        type: list[tuple[string, string]]
        description: Ordered lowercase key names and normalized nullable SQL string expressions.

  - name: insert_new_rows
    description: >
      Inserts rows from source_sql whose key_columns don't already exist in target_relation;
      existing rows are left untouched. Dispatched per adapter — BigQuery has no unique-constraint
      concept and uses MERGE; Postgres uses INSERT ... ON CONFLICT.
    arguments:
      - name: target_relation
        type: Relation
        description: Relation to insert into.
      - name: source_sql
        type: string
        description: SELECT statement producing the candidate rows.
      - name: key_columns
        type: list[string]
        description: Columns identifying an existing row as already present.
      - name: insert_columns
        type: list[string]
        description: Columns to insert, in target-table order.

  - name: ensure_unique_index
    description: >
      Postgres-only: creates the unique index insert_new_rows's ON CONFLICT requires, if missing.
      A no-op on adapters (like BigQuery) that don't need one.
    arguments:
      - name: relation
        type: Relation
        description: Relation to index.
      - name: columns
        type: list[string]
        description: Columns forming the unique constraint.

  - name: incremental_upsert_strategy
    description: >
      Returns the incremental_strategy dqm_reconcile and dqm_annotation_changes should use for the
      current target: 'merge' on BigQuery, 'delete+insert' everywhere else (dbt-postgres only gained
      native 'merge' support targeting Postgres 15+; 'delete+insert' keyed by unique_key is
      semantically equivalent here since every run regenerates the complete, correct set of rows for
      whatever it touches).

  - name: unsupported_adapter_error
    description: >
      Raises a clear compiler error naming the currently supported adapters, instead of letting an
      unimplemented adapter dispatch fail with a confusing runtime SQL error.
    arguments:
      - name: feature
        type: string
        description: Human-readable name of the unimplemented feature, for the error message.

  - name: dqm_relation
    description: Resolves durable tables using the reconcile model database and schema.
  - name: reconcile_pre
    description: Returns ordered setup, input freeze, late check and stage SQL.
  - name: apply_reconciliation
    description: Atomically applies lifecycle changes, events, receipts and generation updates.
  - name: migrations
    description: Ordered adapter-dispatched registry of idempotent apply, backfill and verify macros.
  - name: issues_with_history
    description: Public occurrence projection with previous-history and Passed recurrence context.
  - name: dqm_skip_late_evidence
    description: Records explicitly reviewed late evidence as an audited gap under generation fencing.
  - name: dqm_abandon_runs
    description: Fences expired runs before removing their BigQuery stages.
