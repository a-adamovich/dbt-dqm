version: 2
updates:
  # Read uv.lock so version-type exclusions also cover range-only requirements.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Deferred compatibility work: https://github.com/a-adamovich/dbt-dqm/issues/11
    # Update-type exclusions preserve patch updates and security-update handling.
    ignore:
      # dbt minors are adopted deliberately: the protocol SQL must render identically and the full
      # warehouse suites must pass before the pins and require-dbt-version move (see #11).
      - dependency-name: dbt-core
        update-types: ["version-update:semver-minor"]
      - dependency-name: dbt-bigquery
        update-types: ["version-update:semver-minor"]
      - dependency-name: dbt-postgres
        update-types: ["version-update:semver-minor"]
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]
      # pyarrow majors are adopted deliberately, with the app memory benchmark rerun at the
      # 50k cache boundary (pinned to 23.x; see #11 and docs/scale.md).
      - dependency-name: pyarrow
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patches:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
