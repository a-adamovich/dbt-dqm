# Manual Postgres/platform validation. Stage 1 does not certify BigQuery or authorize publication.
name: Full validation
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  postgres-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        postgres:
        - '14'
        - '16'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: dbtdqm
          POSTGRES_DB: dbt_dqm_ci
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies
      run: uv sync --locked --all-groups --extra postgres
    - name: Check dependency consistency
      run: uv pip check
    - name: Enable pgcrypto
      run: psql -h localhost -U postgres -d dbt_dqm_ci -c "create extension if not exists pgcrypto;"
      env:
        PGPASSWORD: dbtdqm
    - name: Write profiles.yml
      run: |
        mkdir -p ~/.dbt
        cat > ~/.dbt/profiles.yml <<'PROFILES'
        dbt_dqm_demo_postgres:
          target: ci
          outputs:
            ci:
              type: postgres
              host: localhost
              port: 5432
              user: postgres
              pass: dbtdqm
              dbname: dbt_dqm_ci
              schema: dbt_dqm_demo
              threads: 4
        PROFILES
    - name: dbt deps
      working-directory: integration_tests/demo_postgres
      run: uv run --group dbt1 dbt deps
    - name: Full lifecycle walkthrough (initial -> passed -> recurrence)
      working-directory: integration_tests/demo_postgres
      run: |
        set -e
        uv run --group dbt1 dbt run-operation reset_demo_dqm
        uv run --group dbt1 dbt seed
        for scenario in initial passed recurrence; do
          uv run --group dbt1 dbt run --select demo_records --vars "{demo_scenario: $scenario}"
          uv run --group dbt1 dbt-dqm run --vars "{demo_scenario: $scenario}"
          uv run --group dbt1 dbt test --select assert_scenario_outcomes --vars "{demo_scenario: $scenario, dqm_enabled: true}"
        done
    - name: Disabled commands and dedicated-workflow acceptance
      working-directory: integration_tests/demo_postgres
      run: |
        uv run --group dbt1 dbt parse
        uv run --group dbt1 dbt ls --select package:dbt_dqm --resource-type model --output name
        uv run --group dbt1 dbt run-operation assert_postgres_query_plans --vars '{dqm_enabled: true}'
    - name: Transactional acceptance and application interfaces
      shell: bash
      run: |
        set -o pipefail
        mkdir -p acceptance-results
        echo "VALIDATION_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
        uv run --group dbt1 pytest -q -rA -n 4 --durations=25 integration_tests/acceptance/test_postgres.py --junitxml=acceptance-results/junit.xml 2>&1 | tee acceptance-results/pytest.log
      env:
        DBT_DQM_TEST_DSN: host=localhost port=5432 dbname=dbt_dqm_ci user=postgres password=dbtdqm
    - name: Require complete warehouse evidence
      if: always()
      run: uv run --group dbt1 python scripts/ci_validation.py record --junit acceptance-results/junit.xml --output
        acceptance-results/evidence.json --job "postgres-full (${{ matrix.python }}, ${{ matrix.postgres }})" --python
        "${{ matrix.python }}" --postgres "${{ matrix.postgres }}" --engine 1.12.6
      env:
        DBT_DQM_TEST_DSN: host=localhost port=5432 dbname=dbt_dqm_ci user=postgres password=dbtdqm
    - name: Upload acceptance evidence and logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: warehouse-postgres-py${{ matrix.python }}-pg${{ matrix.postgres }}-acceptance
        path: acceptance-results/
        retention-days: 30
        if-no-files-found: error
    name: postgres-full (${{ matrix.python }}, ${{ matrix.postgres }})
    timeout-minutes: 45
  dbt-lower-bound:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dbtdqm
          POSTGRES_DB: dbt_dqm_ci
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        python-version: '3.11'
    - name: Install app and isolated dbt Core 1.11.0
      run: |
        uv sync --locked --all-groups --all-extras
        uv venv /tmp/dbt-dqm-v111-engine --python 3.11
        uv pip install --python /tmp/dbt-dqm-v111-engine/bin/python dbt-core==1.11.0 dbt-postgres==1.11.0 dbt-bigquery==1.11.0 'oauthlib>=4.0.1,<5' 'pyasn1>=0.6.5,<0.7'
    - name: Compile BigQuery on the lower-bound engine without warehouse access
      run: |
        mkdir -p /tmp/dbt-dqm-core111-profile
        cat > /tmp/dbt-dqm-core111-profile/profiles.yml <<'PROFILES'
        dbt_dqm_demo:
          target: offline
          outputs:
            offline:
              type: bigquery
              method: oauth
              project: dbt-dqm-compile-only
              dataset: offline
              location: US
              threads: 1
        PROFILES
        /tmp/dbt-dqm-v111-engine/bin/dbt deps --project-dir integration_tests/demo_bigquery --profiles-dir /tmp/dbt-dqm-core111-profile
        /tmp/dbt-dqm-v111-engine/bin/python scripts/compile_bigquery.py --profiles-dir /tmp/dbt-dqm-core111-profile
    - name: Audit isolated compatibility engine
      run: |
        uv run --group dbt1 python scripts/audit_environment.py --scope core-1.11 \
          --python /tmp/dbt-dqm-v111-engine/bin/python --output acceptance-results/core-1.11-audit.json
    - name: Enable identity hashing
      run: psql -h localhost -U postgres -d dbt_dqm_ci -c "create extension if not exists pgcrypto;"
      env:
        PGPASSWORD: dbtdqm
    - name: Run the warehouse acceptance suite with the older engine
      run: |
        set -o pipefail
        mkdir -p acceptance-results
        echo "VALIDATION_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
        uv run --group dbt1 pytest -q -rA -n 4 --durations=25 integration_tests/acceptance/test_postgres.py --junitxml=acceptance-results/junit.xml 2>&1 | tee acceptance-results/pytest.log
      env:
        DBT_DQM_DBT_EXECUTABLE: /tmp/dbt-dqm-v111-engine/bin/dbt
        DBT_DQM_TEST_DSN: host=localhost port=5432 dbname=dbt_dqm_ci user=postgres password=dbtdqm
    - name: Require complete warehouse evidence
      if: always()
      run: uv run --group dbt1 python scripts/ci_validation.py record --junit acceptance-results/junit.xml --output
        acceptance-results/evidence.json --job "dbt-lower-bound" --python "3.11" --postgres "16" --engine 1.11.0
      env:
        DBT_DQM_ENGINE_PYTHON: /tmp/dbt-dqm-v111-engine/bin/python
        DBT_DQM_TEST_DSN: host=localhost port=5432 dbname=dbt_dqm_ci user=postgres password=dbtdqm
    - name: Upload acceptance evidence and logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: warehouse-postgres-lower-bound-acceptance
        path: acceptance-results/
        retention-days: 30
        if-no-files-found: error
    name: dbt-lower-bound
    timeout-minutes: 45
    env:
      DBT_DQM_DBT_EXECUTABLE: /tmp/dbt-dqm-v111-engine/bin/dbt
      DBT_DQM_ENGINE_PYTHON: /tmp/dbt-dqm-v111-engine/bin/python
  package-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies
      run: uv sync --locked --all-groups --all-extras
    - name: Check dependency consistency
      run: uv pip check
    - name: Build wheel and source distribution
      run: uv build
    - name: Check distribution metadata
      run: uvx --from twine twine check dist/*
    - name: Verify base and optional-adapter wheel installations
      run: |
        wheel="$(pwd)/$(ls dist/*.whl)"
        smoke="$(pwd)/scripts/check_optional_install.py"
        for variant in base bigquery postgres both; do
          environment="/tmp/dbt-dqm-wheel-${variant}"
          requirement="$wheel"
          case "$variant" in
            bigquery|postgres) requirement="${wheel}[${variant}]" ;;
            both) requirement="${wheel}[bigquery,postgres]" ;;
          esac
          uv venv "$environment" --python ${{ matrix.python }}
          uv pip install --python "$environment/bin/python" "$requirement"
          uv pip check --python "$environment/bin/python"
          "$environment/bin/python" "$smoke" "$variant"
        done
    - name: Audit resolved wheel variants and development dependencies
      if: matrix.python == '3.14'
      run: |
        for variant in base bigquery postgres both; do
          uv run --group dbt1 python scripts/audit_environment.py --scope runtime \
            --python "/tmp/dbt-dqm-wheel-${variant}/bin/python" --output "audits/${variant}.json"
        done
        uv run --group dbt1 python scripts/audit_environment.py --scope development \
          --python .venv/bin/python --output audits/development.json
    - name: Wheel carries the security floors (#24)
      run: DBT_DQM_WHEEL="$(ls dist/*.whl)" uv run --group dbt1 pytest -q tests/test_dependency_floors.py tests/test_python_compatibility.py
    - name: Installing the wheel upgrades older vulnerable versions
      run: |
        wheel="$(pwd)/$(ls dist/*.whl)"
        uv venv /tmp/dbt-dqm-old-deps --python ${{ matrix.python }}
        uv pip install --python /tmp/dbt-dqm-old-deps/bin/python sqlparse==0.5.5 urllib3==2.7.0 oauthlib==3.3.1
        cd /tmp
        uv pip install --python /tmp/dbt-dqm-old-deps/bin/python "${wheel}[bigquery,postgres]"
        uv pip check --python /tmp/dbt-dqm-old-deps/bin/python
        /tmp/dbt-dqm-old-deps/bin/python - <<'PY'
        from importlib.metadata import version
        from packaging.version import Version
        floors = {"sqlparse": "0.6.0", "urllib3": "2.8.0", "oauthlib": "4.0.0"}
        installed = {name: version(name) for name in floors}
        print(installed)
        assert all(Version(installed[n]) >= Version(v) for n, v in floors.items()), installed
        PY
    - name: Record installed validation environment
      run: |
        git rev-parse HEAD > validation-environment.txt
        uv pip freeze >> validation-environment.txt
    - name: Upload validation environment
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: environment-package-py${{ matrix.python }}
        path: |
          validation-environment.txt
          audits/
        retention-days: 30
        if-no-files-found: error
    name: package-full (${{ matrix.python }})
  portability-full:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-latest
        - macos-latest
        python:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        python-version: ${{ matrix.python }}
    - name: Install adapters and development dependencies
      run: uv sync --locked --all-groups --all-extras
    - name: Native configuration, process pool and authentication checks
      run: uv run --group dbt1 pytest -q tests/test_runner.py tests/test_portability.py tests/test_config.py tests/test_cli.py
        tests/test_credentials.py tests/test_dependency_floors.py tests/test_python_compatibility.py tests/test_wif.py
        tests/test_review_actions.py tests/test_exports.py tests/test_store.py tests/test_ui.py tests/test_ui_browse.py
    - name: Build and check each installed wheel variant
      run: |
        uv build --no-create-gitignore
        uv run --group dbt1 python scripts/check_wheel_variants.py dist/*.whl
    - name: Record installed validation environment
      run: |
        git rev-parse HEAD > validation-environment.txt
        uv pip freeze >> validation-environment.txt
    - name: Upload validation environment
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: environment-portability-${{ matrix.os }}-py${{ matrix.python }}
        path: |
          validation-environment.txt
          audits/
        retention-days: 30
        if-no-files-found: error
    name: portability-full (${{ matrix.os }}, ${{ matrix.python }})
  bigquery-compile-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies
      run: uv sync --locked --all-groups --extra bigquery
    - name: Check dependency consistency
      run: uv pip check
    - name: Write compile-only profile
      run: |
        mkdir -p ~/.dbt
        cat > ~/.dbt/profiles.yml <<'PROFILES'
        dbt_dqm_demo:
          target: ci
          outputs:
            ci:
              type: bigquery
              method: oauth
              project: dbt-dqm-compile-only
              dataset: dbt_dqm_demo
              location: US
              threads: 1
        PROFILES
    - name: Parse and compile without warehouse introspection
      working-directory: integration_tests/demo_bigquery
      run: |
        uv run --group dbt1 dbt deps
        uv run --group dbt1 dbt parse
        uv run --group dbt1 python ../../scripts/compile_bigquery.py
    - name: Record installed validation environment
      run: |
        git rev-parse HEAD > validation-environment.txt
        uv pip freeze >> validation-environment.txt
    - name: Upload validation environment
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: environment-compile-py${{ matrix.python }}
        path: validation-environment.txt
        retention-days: 30
        if-no-files-found: error
    name: bigquery-compile-full (${{ matrix.python }})
  candidate-qa:
    name: candidate-qa
    uses: ./.github/workflows/candidate-qa.yml
  validated:
    name: validated
    if: always()
    needs:
    - postgres-full
    - dbt-lower-bound
    - package-full
    - portability-full
    - bigquery-compile-full
    - candidate-qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        python-version: '3.14'
    - name: Download warehouse evidence
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: warehouse-*-acceptance
        path: validation-evidence
    - name: Read jobs from this exact workflow attempt
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
        > validation-jobs.json
    - name: Verify every required job and warehouse result
      env:
        VALIDATION_NEEDS: ${{ toJSON(needs) }}
      run: uv run --no-project python scripts/ci_validation.py verify --jobs validation-jobs.json --evidence validation-evidence
    - name: Upload matrix verification inputs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: validation-manifest
        path: |-
          validation-jobs.json
          validation-evidence/
        retention-days: 30
        if-no-files-found: error
