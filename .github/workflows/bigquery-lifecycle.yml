name: BigQuery lifecycle

# On-demand credentialed BigQuery verification. Keyless: GitHub's OIDC token is exchanged through
# Workload Identity Federation for a short-lived token of a dedicated CI service account, so no
# long-lived key is stored. Inert until the repository variables below are set.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        engine: [dbt1, dbt2]
    concurrency:
      group: dbt-dqm-${{ vars.DBT_DQM_BIGQUERY_PROJECT }}-dbt_dqm_scheduled_ci-${{ matrix.engine }}
      cancel-in-progress: false
    if: vars.BIGQUERY_LIFECYCLE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DBT_DQM_BIGQUERY_PROJECT: ${{ vars.DBT_DQM_BIGQUERY_PROJECT }}
      DBT_DQM_BIGQUERY_TEST_PROJECT: ${{ vars.DBT_DQM_BIGQUERY_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          export_environment_variables: false
      - name: Select the CI identity explicitly
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked --all-groups --extra bigquery
      - name: Select an isolated dbt engine
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = dbt2 ]; then
            uv venv /tmp/dbt-dqm-v2-engine --python 3.14
            uv pip install --python /tmp/dbt-dqm-v2-engine/bin/python dbt==2.0.11
            echo "DBT_DQM_DBT_EXECUTABLE=/tmp/dbt-dqm-v2-engine/bin/dbt" >> "$GITHUB_ENV"
            echo "DBT_DQM_ENGINE_PYTHON=/tmp/dbt-dqm-v2-engine/bin/python" >> "$GITHUB_ENV"
          else
            echo "DBT_DQM_DBT_EXECUTABLE=$GITHUB_WORKSPACE/.venv/bin/dbt" >> "$GITHUB_ENV"
            echo "DBT_DQM_ENGINE_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Write profile (Application Default Credentials from the step above)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'PROFILES'
          dbt_dqm_demo:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: "{{ env_var('DBT_DQM_BIGQUERY_PROJECT') }}"
                dataset: dbt_dqm_scheduled_${{ matrix.engine }}
                location: US
                threads: 4
          PROFILES
      - name: The CI identity cannot read the shared QA dataset
        run: |
          uv run --group dbt1 python - <<'PY'
          import os
          from google.api_core.exceptions import Forbidden, NotFound
          from google.cloud import bigquery
          project = os.environ["DBT_DQM_BIGQUERY_PROJECT"]
          try:
              bigquery.Client(project=project).query(
                  f"select 1 from `{project}.dbt_dqm_qa.dqm_install` limit 1").result()
          except (Forbidden, NotFound):
              print("As expected, the CI service account has no access to dbt_dqm_qa.")
          else:
              raise SystemExit("The CI service account can read dbt_dqm_qa; narrow its roles.")
          PY
      - name: Create the dedicated dataset if it is missing
        # reset_demo_dqm fails when the dataset itself is absent. Creating it here makes the
        # CI identity its owner, which is how the rollback guide recognises CI's datasets.
        run: |
          uv run --group dbt1 python - <<'PY'
          import os
          from google.cloud import bigquery
          project = os.environ["DBT_DQM_BIGQUERY_PROJECT"]
          name = f"{project}.dbt_dqm_scheduled_${{ matrix.engine }}"
          wanted = bigquery.Dataset(name)
          wanted.location = "US"
          dataset = bigquery.Client(project=project).create_dataset(wanted, exists_ok=True)
          if dataset.location != "US":
              raise SystemExit(f"The dedicated dataset is in {dataset.location}, not US.")
          print("The dedicated dataset is ready in US.")
          PY
      - name: Full credentialed lifecycle (dedicated dataset)
        working-directory: integration_tests/demo_bigquery
        run: |
          set -e
          "$DBT_DQM_DBT_EXECUTABLE" deps
          "$DBT_DQM_DBT_EXECUTABLE" run-operation reset_demo_dqm
          "$DBT_DQM_DBT_EXECUTABLE" seed
          for scenario in initial passed recurrence; do
            "$DBT_DQM_DBT_EXECUTABLE" run --select demo_records --vars "{demo_scenario: $scenario}"
            uv run --group dbt1 dbt-dqm run --vars "{demo_scenario: $scenario}"
            "$DBT_DQM_DBT_EXECUTABLE" test --select assert_scenario_outcomes --vars "{demo_scenario: $scenario, dqm_enabled: true}"
          done
      - name: Credentialed acceptance suite (parallel, disposable datasets)
        shell: bash
        run: |
          mkdir -p acceptance-results
          set -o pipefail
          selection=()
          if [[ "${{ matrix.engine }}" == dbt1 ]]; then selection=(-m bigquery_smoke); fi
          workers=6
          if [[ "${{ matrix.engine }}" == dbt1 ]]; then workers=4; fi
          uv run --group dbt1 pytest -q -rA -n "$workers" --dist load integration_tests/acceptance/test_bigquery.py "${selection[@]}" \
            --junitxml=acceptance-results/junit.xml 2>&1 | tee acceptance-results/bigquery.log
      - name: Record complete acceptance evidence
        run: |
          uv run --group dbt1 python scripts/bigquery_evidence.py --junit acceptance-results/junit.xml \
            --output acceptance-results/evidence.json --engine "${{ matrix.engine }}" \
            --executable "$DBT_DQM_DBT_EXECUTABLE"
      - name: Sweep stale acceptance datasets
        if: always()
        run: uv run --group dbt1 python integration_tests/acceptance/bigquery_datasets.py --project "$DBT_DQM_BIGQUERY_PROJECT" --older-than-hours 6
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-bigquery-${{ matrix.engine }}-results
          path: acceptance-results/
          if-no-files-found: ignore

  cross-engine-upgrade:
    needs: lifecycle
    if: vars.BIGQUERY_LIFECYCLE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DBT_DQM_BIGQUERY_PROJECT: ${{ vars.DBT_DQM_BIGQUERY_PROJECT }}
      DBT_DQM_BIGQUERY_TEST_PROJECT: ${{ vars.DBT_DQM_BIGQUERY_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The test archives the historical 0.2.4 commit.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          export_environment_variables: false
      - name: Select the CI identity explicitly
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked --all-groups --extra bigquery
      - name: Install both isolated engines
        run: |
          uv venv /tmp/dbt-dqm-v2-engine --python 3.14
          uv pip install --python /tmp/dbt-dqm-v2-engine/bin/python dbt==2.0.11
          {
            echo "DBT_DQM_UPGRADE_CORE_EXECUTABLE=$GITHUB_WORKSPACE/.venv/bin/dbt"
            echo "DBT_DQM_UPGRADE_V2_EXECUTABLE=/tmp/dbt-dqm-v2-engine/bin/dbt"
            echo "DBT_DQM_CORE_ENGINE_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python"
            echo "DBT_DQM_ENGINE_PYTHON=/tmp/dbt-dqm-v2-engine/bin/python"
          } >> "$GITHUB_ENV"
      - name: Serial cross-engine upgrade on a disposable dataset
        shell: bash
        run: |
          mkdir -p acceptance-results
          set -o pipefail
          uv run --group dbt1 pytest -q -rA integration_tests/acceptance/test_identity_upgrade.py \
            --junitxml=acceptance-results/junit.xml 2>&1 | tee acceptance-results/bigquery.log
      - name: Record complete upgrade evidence
        run: |
          uv run --group dbt1 python scripts/bigquery_evidence.py --junit acceptance-results/junit.xml \
            --output acceptance-results/evidence.json --kind upgrade --engine dbt2 \
            --executable "$DBT_DQM_UPGRADE_V2_EXECUTABLE" --core-executable "$DBT_DQM_UPGRADE_CORE_EXECUTABLE"
      - name: Sweep stale acceptance datasets
        if: always()
        run: uv run --group dbt1 python integration_tests/acceptance/bigquery_datasets.py --project "$DBT_DQM_BIGQUERY_PROJECT" --older-than-hours 6
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-engine-bigquery-results
          path: acceptance-results/
          if-no-files-found: ignore

  restricted-permissions:
    needs: cross-engine-upgrade
    if: vars.BIGQUERY_LIFECYCLE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DBT_DQM_BIGQUERY_PROJECT: ${{ vars.DBT_DQM_BIGQUERY_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate the provisioner
        id: provisioner
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          export_environment_variables: false
      - name: Authenticate the restricted runner
        id: runner
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_RUNNER_SERVICE_ACCOUNT }}
          export_environment_variables: false
      - name: Authenticate the restricted reviewer
        id: reviewer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_REVIEWER_SERVICE_ACCOUNT }}
          export_environment_variables: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked --all-groups --extra bigquery
      - name: Restricted runner and reviewer on a disposable dataset
        shell: bash
        env:
          DBT_DQM_BIGQUERY_PROVISIONER_CREDENTIALS: ${{ steps.provisioner.outputs.credentials_file_path }}
          DBT_DQM_BIGQUERY_RUNNER_CREDENTIALS: ${{ steps.runner.outputs.credentials_file_path }}
          DBT_DQM_BIGQUERY_REVIEWER_CREDENTIALS: ${{ steps.reviewer.outputs.credentials_file_path }}
          DBT_DQM_BIGQUERY_RUNNER_IDENTITY: ${{ vars.GCP_CI_RUNNER_SERVICE_ACCOUNT }}
          DBT_DQM_BIGQUERY_REVIEWER_IDENTITY: ${{ vars.GCP_CI_REVIEWER_SERVICE_ACCOUNT }}
        run: |
          mkdir -p acceptance-results
          set -o pipefail
          uv run --group dbt1 pytest -q -rA integration_tests/acceptance/test_bigquery_permissions.py \
            --junitxml=acceptance-results/junit.xml 2>&1 | tee acceptance-results/bigquery.log
      - name: Record complete permissions evidence
        env:
          DBT_DQM_ENGINE_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          uv run --group dbt1 python scripts/bigquery_evidence.py --junit acceptance-results/junit.xml \
            --output acceptance-results/evidence.json --kind permissions --engine dbt1 \
            --executable "$GITHUB_WORKSPACE/.venv/bin/dbt"
      - name: Sweep stale acceptance datasets
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.provisioner.outputs.credentials_file_path }}
        run: uv run --group dbt1 python integration_tests/acceptance/bigquery_datasets.py --project "$DBT_DQM_BIGQUERY_PROJECT" --older-than-hours 6
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restricted-bigquery-results
          path: acceptance-results/
          if-no-files-found: ignore
