name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Verify only; never publish or request PyPI approval"
        type: boolean
        default: true
      local_bigquery_attested:
        description: "Maintainer attests the attached local BigQuery/permissions reports for 0.2.4"
        type: boolean
        default: false
      evidence_tag:
        description: "Draft evidence source; restricted to v0.2.4"
        type: string
        default: v0.2.4
      evidence_digest:
        description: "SHA256 of local-validation-0.2.4.json attached to the draft release"
        type: string
      tested_sha:
        description: "Immutable tested candidate SHA (its tree must equal this checkout)"
        type: string
      ci_run:
        description: "Successful CI run ID; publication requires CI on the merged/tagged commit"
        type: string
      full_run:
        description: "Successful full-validation run ID on the recorded tested SHA"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  fetch-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_digest != ''
    runs-on: ubuntu-latest
    # GitHub exposes drafts only to push-capable credentials. This job only reads
    # release APIs; it has no OIDC, environment, cloud keys, or publishing steps.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate requester and evidence source before draft access
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          ATTESTED: ${{ inputs.local_bigquery_attested }}
          EVIDENCE_TAG: ${{ inputs.evidence_tag }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq '.permission')" = admin
          if [[ "$VERIFY_ONLY" != true ]]; then
            test "$GITHUB_REF" = refs/tags/v0.2.4
            test "$ATTESTED" = true
            test "$EVIDENCE_TAG" = v0.2.4
          fi
      - name: Download draft evidence by numeric asset ID
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_TAG: ${{ inputs.evidence_tag }}
          EVIDENCE_DIGEST: ${{ inputs.evidence_digest }}
        run: python3 scripts/download_release_evidence.py --tag "$EVIDENCE_TAG" --digest "$EVIDENCE_DIGEST" --output "$RUNNER_TEMP/local-evidence/local-validation-0.2.4.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-draft-evidence
          path: ${{ runner.temp }}/local-evidence/local-validation-0.2.4.json
          if-no-files-found: error
  preflight:
    needs: fetch-evidence
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref != 'refs/tags/v0.2.4') ||
       (github.event_name == 'workflow_dispatch' && (inputs.evidence_digest == '' || needs.fetch-evidence.result == 'success')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.14"
      - name: Exercise verification logic with synthetic unit fixtures only
        run: |
          uv sync --locked --all-groups --all-extras
          uv run --no-sync pytest -q tests/test_local_release_evidence.py tests/test_dbt_release_gate.py tests/test_release_workflow.py tests/test_release_evidence.py tests/test_download_release_evidence.py
      - name: Check requester metadata access with the read-only token
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq '.permission'
      - name: Check manual-publication inputs before any release access
        if: github.event_name == 'workflow_dispatch'
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
          ATTESTED: ${{ inputs.local_bigquery_attested }}
          EVIDENCE_DIGEST: ${{ inputs.evidence_digest }}
          TESTED_SHA: ${{ inputs.tested_sha }}
          CI_RUN: ${{ inputs.ci_run }}
          FULL_RUN: ${{ inputs.full_run }}
        run: |
          python3 - <<'PY'
          import os, re
          if os.environ['VERIFY_ONLY'] != 'true':
              assert os.environ['GITHUB_REF'] == 'refs/tags/v0.2.4', 'Manual publication is restricted to v0.2.4'
              assert os.environ['ATTESTED'] == 'true', 'Explicit maintainer attestation is required'
              assert re.fullmatch('[0-9a-f]{64}', os.environ['EVIDENCE_DIGEST']), 'Evidence digest is required'
          if os.environ['EVIDENCE_DIGEST']:
              assert re.fullmatch('[0-9a-f]{40}', os.environ['TESTED_SHA']), 'Immutable tested SHA is required'
              assert os.environ['CI_RUN'].isdigit() and os.environ['FULL_RUN'].isdigit(), 'Both run IDs are required'
          else:
              print('Synthetic verification checks only; live release evidence has not been verified.')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_digest != ''
        with:
          name: verified-draft-evidence
          path: ${{ runner.temp }}/local-evidence
      - name: Verify attached evidence without publication
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_digest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_DIGEST: ${{ inputs.evidence_digest }}
          TESTED_SHA: ${{ inputs.tested_sha }}
          CI_RUN: ${{ inputs.ci_run }}
          FULL_RUN: ${{ inputs.full_run }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          mkdir -p "$RUNNER_TEMP/local-evidence"
          flags=(--verify-only)
          if [[ "$VERIFY_ONLY" != true ]]; then flags=(--attest); fi
          uv run --no-sync python scripts/check_bigquery_release_gate.py --version 0.2.4 \
            --evidence "$RUNNER_TEMP/local-evidence/local-validation-0.2.4.json" \
            --digest "$EVIDENCE_DIGEST" --tested-sha "$TESTED_SHA" \
            --ci-run "$CI_RUN" --full-run "$FULL_RUN" "${flags[@]}"
      - name: Verify normal credentialed evidence before approval
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/check_bigquery_release_gate.py
  release:
    needs: preflight
    # v0.2.4 tag pushes skip before approval or side effects. Other versions retain the live gate.
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref != 'refs/tags/v0.2.4' && needs.preflight.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/tags/v0.2.4' && !inputs.verify_only && needs.preflight.result == 'success'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    services:
      postgres:
        # Preserve the legacy release lifecycle for other versions; the 0.2.4 exception
        # already verifies the full Postgres matrix and does not repeat warehouse tests.
        image: ${{ github.event_name == 'push' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: dbtdqm
          POSTGRES_DB: dbt_dqm_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check the tag matches the package versions
        shell: bash
        run: |
          set -euo pipefail
          python_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          dbt_version="$(python3 -c 'import re; print(re.search(r"^version:\s*[\x27\x22]?([^\x27\x22\s]+)", open("dbt_project.yml").read(), re.M).group(1))')"
          # dbt only accepts SemVer, so a Python pre-release 0.2.0a1 is spelled 0.2.0-a1 there.
          expected_dbt_version="$(python3 -c 'import re, sys; print(re.sub(r"^(\d+\.\d+\.\d+)((?:a|b|rc)\d+)$", r"\1-\2", sys.argv[1]))' "$python_version")"
          if [[ "$dbt_version" != "$expected_dbt_version" ]]; then
            echo "pyproject.toml ($python_version) and dbt_project.yml ($dbt_version) versions differ; expected dbt version $expected_dbt_version." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$python_version" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package version v$python_version." >&2
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Require credentialed BigQuery verification for both engines
        if: github.event_name == 'push'
        run: uv run --no-sync python scripts/check_bigquery_release_gate.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install verification dependencies
        if: github.event_name == 'workflow_dispatch'
        run: uv sync --locked --all-groups --all-extras
      - name: Recheck local evidence after human PyPI approval
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_DIGEST: ${{ inputs.evidence_digest }}
          TESTED_SHA: ${{ inputs.tested_sha }}
          CI_RUN: ${{ inputs.ci_run }}
          FULL_RUN: ${{ inputs.full_run }}
        run: |
          mkdir -p "$RUNNER_TEMP/local-evidence"
          python3 scripts/download_release_evidence.py --tag v0.2.4 --digest "$EVIDENCE_DIGEST" --output "$RUNNER_TEMP/local-evidence/local-validation-0.2.4.json"
          uv run --no-sync python scripts/check_bigquery_release_gate.py --version 0.2.4 --attest \
            --evidence "$RUNNER_TEMP/local-evidence/local-validation-0.2.4.json" \
            --digest "$EVIDENCE_DIGEST" --tested-sha "$TESTED_SHA" --ci-run "$CI_RUN" --full-run "$FULL_RUN"
      - name: Verify, build, and inspect distributions
        run: |
          uv sync --locked --all-groups --all-extras
          uv run --group dbt1 ruff check .
          uv run --group dbt1 pytest -q
          uv build --no-create-gitignore
          uvx --from twine twine check dist/*
      - name: Audit resolved installed wheel variants and development environment
        run: |
          uv run --group dbt1 python scripts/check_wheel_variants.py dist/*.whl --audit-directory release-audits
          uv run --group dbt1 python scripts/audit_environment.py --scope development \
            --python .venv/bin/python --output release-audits/development.json
      - name: Preserve dependency audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-dependency-audits
          path: release-audits/
      - name: Brief installed-wheel verification without a dbt engine
        run: |
          uv venv "$RUNNER_TEMP/release-wheel" --python 3.14
          uv pip install --python "$RUNNER_TEMP/release-wheel/bin/python" "$(pwd)/$(ls dist/*.whl)"
          uv pip check --python "$RUNNER_TEMP/release-wheel/bin/python"
          "$RUNNER_TEMP/release-wheel/bin/python" scripts/check_optional_install.py base
      - name: Configure legacy release-gate Postgres
        if: github.event_name == 'push'
        env:
          PGPASSWORD: dbtdqm
        run: |
          psql -h localhost -U postgres -d dbt_dqm_release -c "create extension if not exists pgcrypto;"
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'PROFILES'
          dbt_dqm_demo_postgres:
            target: release
            outputs:
              release:
                type: postgres
                host: localhost
                port: 5432
                user: postgres
                pass: dbtdqm
                dbname: dbt_dqm_release
                schema: dbt_dqm_demo
                threads: 4
          PROFILES
      - name: Legacy Postgres release lifecycle
        if: github.event_name == 'push'
        working-directory: integration_tests/demo_postgres
        run: |
          uv run --group dbt1 dbt deps
          uv run --group dbt1 dbt run-operation reset_demo_dqm
          uv run --group dbt1 dbt seed
          for scenario in initial passed recurrence; do
            uv run --group dbt1 dbt run --select demo_records --vars "{demo_scenario: $scenario}"
            uv run --group dbt1 dbt-dqm run --vars "{demo_scenario: $scenario}"
            uv run --group dbt1 dbt test --select assert_scenario_outcomes --vars "{demo_scenario: $scenario, dqm_enabled: true}"
          done
      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify distribution provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          files=(dist/* dist/.[!.]* dist/..?*)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 || ${#files[@]} != 2 )); then
            echo 'Expected exactly one wheel and one source archive, with no other distribution files.' >&2
            exit 1
          fi
          for artifact in "${wheels[@]}" "${sdists[@]}"; do
            if [[ ! -f "$artifact" || -L "$artifact" ]]; then
              echo "Expected a regular distribution file: $artifact" >&2
              exit 1
            fi
            verified=false
            for attempt in 1 2 3; do
              if gh attestation verify "$artifact" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$GITHUB_SHA" \
                --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners; then
                verified=true
                break
              fi
              if (( attempt < 3 )); then
                sleep 5
              fi
            done
            if [[ "$verified" != true ]]; then
              echo "Provenance verification failed after three attempts: $artifact" >&2
              exit 1
            fi
          done
      - name: Publish to PyPI through trusted publishing
        run: uv publish
      - name: Create GitHub release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            dbt_version="$(python3 -c 'import re, sys; print(re.sub(r"^(\d+\.\d+\.\d+)((?:a|b|rc)\d+)$", r"\1-\2", sys.argv[1]))' "$version")"
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag \
              --prerelease --title "dbt-dqm ${GITHUB_REF_NAME} (pre-release)" \
              --notes "Pre-release: interfaces may change. Install the Python app with pip install 'dbt-dqm[bigquery]==${version}' or 'dbt-dqm[postgres]==${version}' and install the dbt package separately from Git revision ${GITHUB_REF_NAME} (its dbt_project.yml spells the version ${dbt_version}). Version 0.2.0a8 preserves a4-a7 history when resolved names are unchanged. Alias naming now applies to state tables too: changed namespaces require a confirmed fresh start, leaving legacy shared history untouched. Pass matching naming vars to run, app and workspace. The optional --summary reports OPENED (NEW), RECURRING and ARCHIVED changes applied by the reconciliation alongside NEW (status) and ACTIVE workload by saved owner. Quiet test results sort by status and name, and completion reports collections reaching their native limit. Export columns follow review order and timestamp zones are labeled. Upgrades from earlier alphas still require the migration steps documented in README.md. Scheduled full refreshes now require --yes. The app supports cross-page bulk edits and filtered CSV/Excel exports of saved issues. DQM is disabled during ordinary commands. Use dbt-dqm run for full capture and bounded native test limits (default 100). Ownership uses dqm_owner with owner metadata fallback. See README.md and CHANGELOG.md at this tag for supported versions and operating limits."
          elif [[ "$GITHUB_REF_NAME" == "v0.2.0" ]]; then
            gh release create "${GITHUB_REF_NAME}" dist/* --notes-file docs/release-notes-0.2.0.md --verify-tag
          elif [[ "$GITHUB_REF_NAME" == "v0.2.4" ]]; then
            gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft' | grep -qx true
            gh release upload "${GITHUB_REF_NAME}" dist/*
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          elif [[ "$GITHUB_REF_NAME" == "v0.2.1" ]]; then
            gh release create "${GITHUB_REF_NAME}" dist/* --notes-file docs/release-notes-0.2.1.md --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
