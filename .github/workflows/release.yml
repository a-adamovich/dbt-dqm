name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dbtdqm
          POSTGRES_DB: dbt_dqm_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - name: Verify, build, and inspect distributions
        run: |
          uv sync --all-groups
          uv run ruff check .
          uv run pytest -q
          uv build
          uvx --from twine twine check dist/*
      - name: Configure release-gate Postgres
        run: |
          psql -h localhost -U postgres -d dbt_dqm_release -c "create extension if not exists pgcrypto;"
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'PROFILES'
          dbt_dqm_demo_postgres:
            target: release
            outputs:
              release:
                type: postgres
                host: localhost
                port: 5432
                user: postgres
                pass: dbtdqm
                dbname: dbt_dqm_release
                schema: dbt_dqm_demo
                threads: 4
          PROFILES
        env:
          PGPASSWORD: dbtdqm
      - name: Full Postgres release lifecycle
        working-directory: integration_tests/demo_postgres
        run: |
          uv run dbt deps
          uv run dbt run-operation reset_demo_dqm
          uv run dbt seed
          for scenario in initial passed recurrence; do
            uv run dbt run --select demo_records --vars "{demo_scenario: $scenario}"
            uv run dbt test --select tag:dqm --vars "{demo_scenario: $scenario}"
            uv run dbt test --select assert_collection_guardrail_fixtures
            uv run dbt build --select package:dbt_dqm --vars "{demo_scenario: $scenario}"
            uv run dbt test --select assert_scenario_outcomes --vars "{demo_scenario: $scenario}"
          done
      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify distribution provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          files=(dist/* dist/.[!.]* dist/..?*)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 || ${#files[@]} != 2 )); then
            echo 'Expected exactly one wheel and one source archive, with no other distribution files.' >&2
            exit 1
          fi
          for artifact in "${wheels[@]}" "${sdists[@]}"; do
            if [[ ! -f "$artifact" || -L "$artifact" ]]; then
              echo "Expected a regular distribution file: $artifact" >&2
              exit 1
            fi
            verified=false
            for attempt in 1 2 3; do
              if gh attestation verify "$artifact" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$GITHUB_SHA" \
                --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners; then
                verified=true
                break
              fi
              if (( attempt < 3 )); then
                sleep 5
              fi
            done
            if [[ "$verified" != true ]]; then
              echo "Provenance verification failed after three attempts: $artifact" >&2
              exit 1
            fi
          done
      - name: Publish to PyPI through trusted publishing
        run: uv publish
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
