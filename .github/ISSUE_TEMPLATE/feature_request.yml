name: Feature request
description: Propose a focused open-source improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: adapters
    attributes:
      label: Adapter and compatibility implications
